server:
  port: 8080

spring:
  datasource:
    # 默认 H2 内存库便于本地跑通；生产/容器用 mysql profile（application-mysql.yml）
    url: jdbc:h2:mem:wmdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  raw-bucket: raw-file
  wm-bucket: wm-file

logging:
  level:
    com.example.wmupload: INFO
